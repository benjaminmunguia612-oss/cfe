services:
  - type: web
    name: cfeguia
    runtime: python
    plan: free            # verifica los límites vigentes del plan
    buildCommand: pip install -r requirements.txt && python -m app.build_corpus --check
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LLM_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ID_SALT
        sync: false
      - key: GITHUB_TOKEN        # opcional: permite publicar el corpus desde /admin
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
